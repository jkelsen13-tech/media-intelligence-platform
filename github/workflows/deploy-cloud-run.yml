name: Deploy extraction service to Cloud Run (06A Step 0)

# Manual trigger only. Do NOT add push/PR triggers — auto-deploy is a
# separate owner decision once the pipeline has been proven once.
on:
  workflow_dispatch:

env:
  GCP_PROJECT: mop-extraction
  REGION: us-central1
  SERVICE: mop-extraction

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source services/extraction \
            --region "$REGION" \
            --project "$GCP_PROJECT" \
            --min-instances=0 \
            --max-instances=1 \
            --allow-unauthenticated \
            --quiet

      - name: Evidence — service configuration
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$GCP_PROJECT" \
            --format yaml
