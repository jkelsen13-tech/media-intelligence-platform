<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIP — Media Intelligence Platform</title>
    <script>
      // 04_TRACK_B Step 1 flash fix: paint-time theme hint from the last
      // resolved value, so repeat visits don't paint the dark backdrop while
      // the flag fetch is in flight. Cosmetic only — src/lib/themeFlag.js
      // re-resolves authoritatively before render and overwrites this.
      try {
        if (localStorage.getItem('mip-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (e) { /* no storage -> dark default, withhold posture */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
